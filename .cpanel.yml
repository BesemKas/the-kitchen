---
# cPanel Git Version Control → "Deploy HEAD Commit" runs these tasks.
# Copies the app into public_html. Never touches app/config.php (it isn't in the repo),
# and leaves setup.php out: it is only needed for a brand-new install.
deployment:
  tasks:
    - export DEPLOYPATH=/home1/tru645/public_html/
    - /bin/mkdir -p ${DEPLOYPATH}app ${DEPLOYPATH}assets
    - /bin/cp -f index.php api.php manifest.webmanifest .htaccess ${DEPLOYPATH}
    - /bin/cp -f app/bootstrap.php app/schema.sql app/config.sample.php app/.htaccess ${DEPLOYPATH}app/
    - /bin/cp -Rf assets/. ${DEPLOYPATH}assets/

name: South African products from Open Food Facts

# Builds data/off-za.jsonl.gz from Open Food Facts' data export (their API isn't for bulk downloads).
# Runs on the 1st of every month and whenever started by hand (Actions -> this workflow -> Run workflow).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
  push:
    branches: [feat/off-export]
    paths: ['tools/off_za_export.py', '.github/workflows/off-za.yml']

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'duckdb>=1.1'
      - name: Look at the export
        run: python tools/off_za_export.py --describe
